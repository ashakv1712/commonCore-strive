<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Strive Math · Grade 7 Learning Outcomes</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700&family=Inconsolata:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<style>
/* ══ TOKENS ══ */
:root{
  --orange:#FF6635; --orange-lt:rgba(255,102,53,0.10); --orange-bd:rgba(255,102,53,0.22);
  --purple:#7058FF; --purple-lt:rgba(112,88,255,0.09); --purple-bd:rgba(112,88,255,0.20);
  --pink:  #FF4F84; --pink-lt:  rgba(255,79,132,0.09);  --pink-bd:  rgba(255,79,132,0.20);
  --amber: #FFA41C; --amber-lt: rgba(255,164,28,0.10);  --amber-bd: rgba(255,164,28,0.22);
  --blue:  #2C81ED; --blue-lt:  rgba(44,129,237,0.09);  --blue-bd:  rgba(44,129,237,0.20);
  --green: #B0EB33;
  --navy:  #0F1574; --navy-lt:  #878AB9; --navy-faint: rgba(15,21,116,0.06);
  --rainbow: linear-gradient(to right,#FFA41C,#FF4F84,#7058FF,#2C81ED,#B0EB33);
  --cta-grad: linear-gradient(135deg,#FFA41C,#FF4F84,#7058FF);
  --heading-grad: linear-gradient(135deg,#FE6636,#FF4F84 40%,#7058FF 80%);

  --bg:     #FAFAFA;
  --white:  #FFFFFF;
  --ink:    #0F1574;
  --ink2:   #575863;
  --ink3:   #878AB9;
  --ink4:   #B1B1C2;
  --border: rgba(15,21,116,0.08);
  --border-hover: rgba(15,21,116,0.18);

  --sh-xs:  0 1px 3px rgba(15,21,116,0.06);
  --sh-sm:  0 2px 8px rgba(15,21,116,0.08);
  --sh-md:  0 8px 30px rgba(15,21,116,0.09);
  --sh-lg:  0 20px 60px rgba(15,21,116,0.12);
  --sh-btn: 0 4px 14px rgba(0,0,0,0.18);

  --r-sm:4px; --r-md:12px; --r-lg:18px; --r-xl:24px; --r-pill:100px;

  --font:'Jost',sans-serif;
  --mono:'Inconsolata',monospace;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}

body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
  line-height:1.6;
}

/* ── subtle bg decoration ── */
body::before{
  content:'';
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 60% 50% at -5% -5%, rgba(255,102,53,0.07) 0%, transparent 55%),
    radial-gradient(ellipse 50% 40% at 105% 0%,  rgba(112,88,255,0.06) 0%, transparent 55%),
    radial-gradient(ellipse 40% 35% at 105% 105%,rgba(44,129,237,0.05) 0%, transparent 50%);
}
body::after{
  content:'';
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:radial-gradient(circle, rgba(15,21,116,0.055) 1px, transparent 1px);
  background-size:32px 32px;
}

/* ── floating symbols ── */
.sym-layer{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.sym{
  position:absolute;font-family:var(--mono);font-weight:700;
  opacity:0;animation:floatUp linear infinite;user-select:none;
}
@keyframes floatUp{
  0%{opacity:0;transform:translateY(0) rotate(0deg);}
  10%{opacity:1;}88%{opacity:0.5;}
  100%{opacity:0;transform:translateY(-90vh) rotate(18deg);}
}

/* ── page wrapper ── */
.page{max-width:none;width:100%;margin:0;padding:0 48px 100px;position:relative;z-index:1;}

/* ══ NAV ══ */
.nav{
  position:sticky;top:0;z-index:200;
  background:rgba(250,250,250,0.92);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  margin:0 -48px;
  padding:0 48px;
  display:flex;align-items:center;justify-content:space-between;
  height:58px;
}
.logo{height:24px;display:block;}
.nav-right{display:flex;align-items:center;gap:10px;}

/* ── GRADE SWITCHER ── */
.grade-switcher{position:relative;}
.nav-badge{
  display:flex;align-items:center;gap:8px;
  background:var(--navy);border-radius:var(--r-pill);
  padding:6px 12px 6px 14px;
  box-shadow:var(--sh-btn);cursor:pointer;
  transition:background 0.18s,box-shadow 0.18s;
  user-select:none;
}
.nav-badge:hover{background:#1a268a;box-shadow:0 6px 20px rgba(15,21,116,0.35);}
.nav-badge-info{display:flex;flex-direction:column;gap:0;}
.nav-badge-label{font-size:12px;font-weight:700;color:#fff;letter-spacing:0.04em;line-height:1.2;}
.nav-badge-sub{font-size:9px;color:rgba(255,255,255,0.5);letter-spacing:0.03em;line-height:1;}
.nav-badge-chevron{color:rgba(255,255,255,0.6);margin-left:2px;transition:transform 0.2s;flex-shrink:0;}
.grade-switcher.open .nav-badge-chevron{transform:rotate(180deg);}

.grade-dropdown{
  position:absolute;top:calc(100% + 8px);right:0;
  background:var(--white);border:1px solid var(--border);
  border-radius:var(--r-lg);box-shadow:var(--sh-lg);
  overflow:hidden;min-width:200px;
  opacity:0;pointer-events:none;
  transform:translateY(-6px) scale(0.97);transform-origin:top right;
  transition:opacity 0.18s,transform 0.18s;z-index:300;
}
.grade-switcher.open .grade-dropdown{opacity:1;pointer-events:all;transform:none;}
.grade-dropdown-hdr{
  padding:9px 14px 6px;
  font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;
  color:var(--ink4);border-bottom:1px solid var(--border);
}
.grade-opt{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;font-size:13px;font-weight:600;color:var(--ink2);
  cursor:pointer;transition:background 0.13s;
  border-bottom:1px solid rgba(15,21,116,0.04);
}
.grade-opt:last-child{border-bottom:none;}
.grade-opt:hover{background:rgba(15,21,116,0.04);color:var(--navy);}
.grade-opt.active{color:var(--purple);background:var(--purple-lt);}
.grade-opt.active::after{content:'✓';font-size:11px;font-weight:800;color:var(--purple);}
.grade-opt.soon{color:var(--ink4);cursor:default;}
.grade-opt.soon:hover{background:transparent;color:var(--ink4);}
.soon-tag{
  font-size:9px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;
  color:var(--amber);background:var(--amber-lt);border:1px solid var(--amber-bd);
  border-radius:4px;padding:1px 6px;
}

/* ══ HERO ══ */
.hero{
  padding:40px 0 28px;
  text-align:center;
  position:relative;
}
.hero::after{
  content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:80%;height:1px;background:var(--rainbow);opacity:0.3;
}
.hero-eyebrow{
  display:inline-flex;align-items:center;gap:6px;
  font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;
  color:var(--purple);
  background:var(--purple-lt);
  border:1.5px solid var(--purple-bd);
  border-radius:var(--r-pill);padding:4px 14px;margin-bottom:14px;
}
.eyebrow-dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--cta-grad);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(1.6);}}

.hero h1{
  font-size:clamp(28px,3.5vw,52px);
  font-weight:800;line-height:1.05;
  letter-spacing:-0.025em;
  color:var(--navy);
  margin-bottom:0;
}
.hero h1 .grad{
  background:var(--heading-grad);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  font-style:italic;font-weight:700;
  padding-bottom:0.06em;display:inline;
}
.hero-sub{
  font-size:14px;color:var(--ink3);
  max-width:440px;margin:0 auto 20px;line-height:1.65;
}
.hero-stats{
  display:flex;justify-content:center;gap:8px;flex-wrap:wrap;
}
.h-stat{
  display:flex;align-items:center;gap:6px;
  background:var(--white);border:1.5px solid var(--border);
  border-radius:var(--r-pill);padding:5px 14px;
  box-shadow:var(--sh-xs);
}
.h-stat-n{font-size:15px;font-weight:800;line-height:1;}
.h-stat-l{font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink4);}

/* ══ DOMAIN FILTER ══ */
.filter-bar{
  display:flex;gap:5px;padding:20px 0 0;
  overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap;
}
.filter-bar::-webkit-scrollbar{display:none;}
.fb{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 13px;border-radius:var(--r-pill);
  border:1.5px solid var(--border);background:var(--white);
  font-family:var(--font);font-size:11px;font-weight:600;
  color:var(--ink3);cursor:pointer;white-space:nowrap;
  box-shadow:var(--sh-xs);transition:all 0.18s;letter-spacing:0.01em;
}
.fb:hover{color:var(--navy);border-color:var(--border-hover);transform:translateY(-1px);box-shadow:var(--sh-sm);}
.fb.on{color:#fff;border-color:transparent;box-shadow:var(--sh-btn);transform:translateY(-1px);}
.fb-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.fb-count{
  font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;
  background:rgba(0,0,0,0.07);
}
.fb.on .fb-count{background:rgba(255,255,255,0.2);}

/* ══ SECTION HEADER ══ */
.sec-hdr{
  display:flex;align-items:center;gap:12px;padding:22px 0 14px;
}
.sec-hdr-txt{
  font-size:9px;font-weight:700;letter-spacing:0.14em;
  text-transform:uppercase;color:var(--ink4);white-space:nowrap;
}
.sec-hdr-line{flex:1;height:1px;background:var(--border);}

/* ══ DOMAIN ACCORDION CARDS ══ */
.acc-list{display:flex;flex-direction:column;gap:8px;}

.dom-card{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:var(--r-xl);
  box-shadow:var(--sh-xs);
  overflow:hidden;
  transition:box-shadow 0.2s,border-color 0.2s;
}
.dom-card:hover{box-shadow:var(--sh-sm);}
.dom-card.open{box-shadow:var(--sh-md);border-color:rgba(15,21,116,0.12);}

/* card accent stripe */
.dom-stripe{height:3px;}

/* domain header */
.dom-hdr{
  display:flex;align-items:center;gap:12px;
  padding:16px 20px;cursor:pointer;user-select:none;
  transition:background 0.15s;
}
.dom-hdr:hover{background:rgba(15,21,116,0.018);}
.dom-icon{
  width:clamp(40px, 3vw, 52px);
  height:clamp(40px, 3vw, 52px);
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);
  font-size:clamp(16px, 1.2vw, 20px);
  font-weight:900;flex-shrink:0;
}
.dom-info{flex:1;min-width:0;}
.dom-name{
  font-size:clamp(14px, 1.1vw, 17px);
  font-weight:700;color:var(--navy);
  margin-bottom:2px;letter-spacing:-0.01em;
}
.dom-desc{
  font-size:clamp(11px, 0.85vw, 13.5px);
  color:var(--ink4);
}
.dom-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.dom-code{
  font-family:var(--mono);
  font-size:clamp(9px, 0.7vw, 11px);
  font-weight:700;
  padding:3px 9px;border-radius:5px;border:1.5px solid;letter-spacing:0.05em;
}
.dom-count{
  font-size:clamp(10px, 0.75vw, 12px);
  font-weight:600;color:var(--ink4);
  background:var(--bg);border:1px solid var(--border);
  border-radius:5px;padding:3px 9px;
}
.dom-chev{
  width:clamp(26px, 1.9vw, 32px);
  height:clamp(26px, 1.9vw, 32px);
  border-radius:7px;
  background:rgba(15,21,116,0.04);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  transition:all 0.25s cubic-bezier(0.4,0,0.2,1);
}
.dom-card.open .dom-chev{background:var(--navy);border-color:var(--navy);}
.dom-chev svg{transition:transform 0.25s cubic-bezier(0.4,0,0.2,1);color:var(--ink4);}
.dom-card.open .dom-chev svg{transform:rotate(180deg);color:#fff;}

/* ══ OUTCOMES LIST ══ */
.dom-body{max-height:0;overflow:hidden;transition:max-height 0.48s cubic-bezier(0.4,0,0.2,1);}
.dom-body-inner{padding:0 0 10px;}
.dom-sep{height:1px;background:var(--border);margin:0 20px 8px;}

/* ── OUTCOME ROW ── */
.oc-row{
  display:flex;align-items:center;gap:16px;
  padding:0 20px;
  position:relative;cursor:pointer;
  transition:background 0.15s;
}
.oc-row:hover{background:rgba(15,21,116,0.025);}
.oc-row+.oc-row{border-top:1px solid rgba(15,21,116,0.05);}

/* TITLE CLUSTER (left) — number + title, sized to content */
.oc-row-left{
  display:flex;align-items:center;gap:12px;
  padding:14px 0;
  flex:0 1 auto;min-width:0;max-width:60%;
}
.oc-num{
  font-family:var(--mono);
  font-size:clamp(9px, 0.7vw, 11px);
  font-weight:700;
  width:clamp(22px, 1.7vw, 28px);
  height:clamp(22px, 1.7vw, 28px);
  border-radius:6px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  letter-spacing:0;
}
.oc-title{
  font-size:clamp(13px, 0.95vw, 15.5px);
  font-weight:500;color:var(--ink2);line-height:1.4;
  transition:color 0.15s;
}
.oc-row:hover .oc-title{color:var(--navy);}
.oc-row.is-open .oc-title{color:var(--navy);font-weight:600;}

/* CENTER ZONE — math example pill, fills empty space */
.oc-row-center{
  flex:1 1 auto;
  display:flex;align-items:center;justify-content:center;
  padding:0 16px;min-width:0;
}

/* RIGHT ZONE — toggle aligned right, fixed width */
.oc-row-right{
  flex:0 0 auto;
  display:flex;align-items:center;
}

/* domain worksheet button on header */
.dom-ws-btn{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--font);
  font-size:clamp(11px, 0.85vw, 13.5px);
  font-weight:700;
  letter-spacing:0.02em;
  border:1.5px solid;
  border-radius:var(--r-pill);
  padding:7px 14px;
  cursor:pointer;
  transition:all 0.18s;
  white-space:nowrap;
  flex-shrink:0;
}
.dom-ws-btn:hover{
  filter:brightness(0.92);
  transform:translateY(-1px);
  box-shadow:var(--sh-md);
}

/* ── math example pill (sits in center of row) ── */
.oc-example{
  display:inline-flex;align-items:center;
  font-family:var(--mono);
  font-size:clamp(12px, 0.85vw, 14.5px);
  font-weight:600;
  color:var(--ink3);
  background:rgba(15,21,116,0.04);
  border:1px solid rgba(15,21,116,0.08);
  border-radius:8px;
  padding:4px 12px;
  letter-spacing:0;
  white-space:nowrap;
  transition:all 0.18s;
}
.oc-row:hover .oc-example{
  background:rgba(15,21,116,0.08);
  color:var(--navy);
  border-color:rgba(15,21,116,0.14);
}
.oc-row.is-open .oc-example{display:none;}

/* on narrow screens collapse center into left cluster */
@media (max-width: 780px){
  .oc-row{flex-wrap:wrap;}
  .oc-row-left{max-width:none;flex:1 1 100%;}
  .oc-row-center{flex:0 1 auto;justify-content:flex-start;padding:0 0 12px 56px;}
}

/* ── CCSS code badge inside expanded view ── */
.oc-ccss-row{
  display:flex;align-items:center;gap:10px;
  margin-bottom:10px;flex-wrap:wrap;
}
.oc-ccss-code{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:10px;font-weight:700;
  padding:3px 9px;border-radius:5px;
  border:1.5px solid;letter-spacing:0.04em;
}
.oc-ccss-code::before{
  content:'CCSS';
  font-size:8px;font-weight:700;letter-spacing:0.1em;
  opacity:0.6;
  padding-right:5px;border-right:1px solid currentColor;
  border-right-color:rgba(0,0,0,0.12);
}

/* ── Unit Mastery Test button (bottom of each domain) ── */
.unit-mastery-wrap{
  padding:14px 20px 18px;
  display:flex;justify-content:flex-end;
  border-top:1px solid var(--border);
  margin-top:6px;
  background:rgba(15,21,116,0.012);
}
.unit-mastery-btn{
  display:inline-flex;align-items:center;gap:7px;
  font-family:var(--font);font-size:12px;font-weight:700;
  letter-spacing:0.02em;
  border:1.5px solid;
  border-radius:var(--r-pill);
  padding:8px 16px;
  cursor:pointer;
  transition:all 0.18s;
  white-space:nowrap;
  background:transparent;
}
.unit-mastery-btn:hover{
  color:#fff !important;
  transform:translateY(-1px);
  box-shadow:var(--sh-md);
}

/* ── PDF placeholder ── */
.oc-pdf-placeholder{
  background:var(--white);
  border:1.5px dashed var(--border-hover);
  border-radius:var(--r-md);
  padding:18px 16px;
  display:flex;align-items:center;gap:14px;
  min-height:130px;
  transition:all 0.2s;
}
.oc-pdf-placeholder:hover{
  border-color:var(--ink3);
  background:rgba(255,255,255,0.6);
}
.oc-pdf-icon{
  flex-shrink:0;
  width:48px;height:60px;
  border-radius:6px;
  background:linear-gradient(135deg,rgba(15,21,116,0.06),rgba(15,21,116,0.02));
  border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.oc-pdf-icon::after{
  content:'PDF';
  font-family:var(--mono);font-size:9px;font-weight:900;
  letter-spacing:0.05em;
}
.oc-pdf-icon-fold{
  position:absolute;top:-1px;right:-1px;
  width:13px;height:13px;
  background:var(--bg);
  border-left:1.5px solid var(--border);
  border-bottom:1.5px solid var(--border);
  border-radius:0 0 0 4px;
}
.oc-pdf-text{flex:1;min-width:0;}
.oc-pdf-title{
  font-size:12.5px;font-weight:700;color:var(--navy);
  margin-bottom:3px;line-height:1.4;
}
.oc-pdf-desc{
  font-size:11.5px;color:var(--ink3);line-height:1.55;
}

.oc-toggle{
  width:20px;height:20px;border-radius:5px;
  border:1px solid var(--border);background:rgba(15,21,116,0.03);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all 0.2s;position:relative;
}
.oc-row.is-open .oc-toggle{background:var(--navy);border-color:var(--navy);}
.oc-toggle::before,.oc-toggle::after{content:'';position:absolute;border-radius:1px;transition:all 0.2s;}
.oc-toggle::before{width:8px;height:1.5px;background:var(--ink4);}
.oc-toggle::after{width:1.5px;height:8px;background:var(--ink4);}
.oc-row.is-open .oc-toggle::before,.oc-row.is-open .oc-toggle::after{background:#fff;}
.oc-row.is-open .oc-toggle::after{transform:rotate(90deg);opacity:0;}

/* ── ROW DETAIL ── */
.oc-det{max-height:0;overflow:hidden;transition:max-height 0.36s cubic-bezier(0.4,0,0.2,1);}
.oc-det-in{
  padding:12px 20px 16px 52px;
  background:rgba(15,21,116,0.018);
  border-top:1px solid rgba(15,21,116,0.06);
}
.oc-desc{
  font-size:12.5px;color:var(--ink2);line-height:1.7;
  margin-bottom:12px;max-width:620px;
}
.oc-cols{display:grid;grid-template-columns:1fr 1.4fr;gap:18px;align-items:start;}
@media(max-width:780px){.oc-cols{grid-template-columns:1fr;}}
.oc-col-lbl{
  font-size:8px;font-weight:700;letter-spacing:0.12em;
  text-transform:uppercase;color:var(--ink4);margin-bottom:6px;
}
.oc-tags{display:flex;flex-wrap:wrap;gap:4px;}
.oc-tag{
  font-size:11px;font-weight:600;padding:3px 10px;
  border-radius:var(--r-pill);border:1.5px solid;
  transition:transform 0.15s;cursor:default;
}
.oc-tag:hover{transform:translateY(-1px);}
.oc-skills{display:flex;flex-direction:column;gap:4px;}
.oc-skill{
  display:flex;align-items:flex-start;gap:7px;
  background:var(--white);border:1px solid var(--border);
  border-radius:6px;padding:6px 10px;
  font-size:11.5px;color:var(--ink2);line-height:1.4;
  transition:border-color 0.15s,transform 0.15s;
}
.oc-skill:hover{border-color:var(--border-hover);transform:translateX(2px);}
.oc-skill-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0;margin-top:5px;}

/* ══ WORKSHEET PREVIEW TOOLTIP ══ */
.ws-tooltip{
  position:fixed;
  z-index:500;
  pointer-events:none;
  opacity:0;
  transform:translateY(6px) scale(0.97);
  transition:opacity 0.18s,transform 0.18s;
  width:320px;
}
.ws-tooltip.visible{
  opacity:1;transform:translateY(0) scale(1);
  pointer-events:all;
}
.ws-card{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  box-shadow:var(--sh-lg);
  overflow:hidden;
}
.ws-card-header{
  padding:13px 15px 9px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:9px;
}
.ws-card-icon{
  width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:900;font-family:var(--mono);flex-shrink:0;
}
.ws-card-title{font-size:12.5px;font-weight:700;color:var(--navy);line-height:1.3;}
.ws-card-sub{font-size:10px;color:var(--ink4);margin-top:2px;font-family:var(--mono);letter-spacing:0.02em;}
.ws-preview-area{
  padding:11px 15px;
  background:rgba(15,21,116,0.02);
}
.ws-preview-label{
  font-size:9px;font-weight:700;letter-spacing:0.1em;
  text-transform:uppercase;color:var(--ink4);margin-bottom:8px;
}
.ws-q{
  background:var(--white);border:1px solid var(--border);
  border-radius:7px;padding:9px 11px;margin-bottom:5px;
  font-size:12.5px;color:var(--ink);font-weight:500;line-height:1.55;
  display:flex;align-items:flex-start;gap:7px;
  font-family:var(--mono);
  letter-spacing:0.01em;
}
.ws-q-num{
  font-family:var(--mono);font-size:10px;font-weight:700;
  color:var(--ink4);flex-shrink:0;margin-top:2px;
}
.ws-cta{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 14px 10px;
  font-size:11px;font-weight:700;color:var(--purple);
  cursor:pointer;
  background:var(--purple-lt);
  border-top:1px solid var(--purple-bd);
  transition:background 0.15s;
  pointer-events:all;
}
.ws-cta:hover{background:var(--purple);color:#fff;}

/* ══ WORKSHEET MODAL ══ */
.modal-overlay{
  position:fixed;inset:0;z-index:900;
  background:rgba(15,21,116,0.32);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity 0.25s;
}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{
  background:var(--white);border-radius:var(--r-xl);box-shadow:var(--sh-lg);
  width:100%;max-width:640px;max-height:90vh;
  overflow:hidden;display:flex;flex-direction:column;
  transform:translateY(16px) scale(0.98);
  transition:transform 0.28s cubic-bezier(0.34,1.2,0.64,1);
}
.modal-overlay.open .modal{transform:none;}
.modal-top{
  display:flex;align-items:center;gap:12px;
  padding:16px 20px 14px;border-bottom:1px solid var(--border);flex-shrink:0;
}
.modal-icon{
  width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:15px;font-weight:900;flex-shrink:0;
}
.modal-info{flex:1;min-width:0;}
.modal-domain{font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:2px;}
.modal-title{font-size:15px;font-weight:700;color:var(--navy);line-height:1.3;}
.modal-close{
  width:30px;height:30px;border-radius:8px;
  border:1px solid var(--border);background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;transition:all 0.15s;
  font-size:14px;color:var(--ink3);
}
.modal-close:hover{background:var(--navy);color:#fff;border-color:var(--navy);}
.modal-body{overflow-y:auto;flex:1;}
.modal-body::-webkit-scrollbar{width:4px;}
.modal-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* ── MODE CHOICE SCREEN ── */
.mode-screen{padding:24px 24px 28px;display:flex;flex-direction:column;gap:14px;}
.mode-screen-label{
  font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--ink4);text-align:center;margin-bottom:4px;
}
.mode-card{
  display:flex;align-items:center;gap:16px;
  border:1.5px solid var(--border);border-radius:var(--r-lg);
  padding:18px 20px;cursor:pointer;
  transition:all 0.18s;
  background:var(--white);
}
.mode-card:hover{border-color:var(--border-hover);box-shadow:var(--sh-md);transform:translateY(-1px);}
.mode-card-icon{
  width:44px;height:44px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:20px;
}
.mode-card-body{flex:1;}
.mode-card-title{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:3px;}
.mode-card-desc{font-size:12px;color:var(--ink3);line-height:1.5;}
.mode-card-arrow{color:var(--ink4);flex-shrink:0;transition:transform 0.18s;}
.mode-card:hover .mode-card-arrow{transform:translateX(3px);color:var(--navy);}
.mode-card.mode-online{border-color:var(--purple-bd);}
.mode-card.mode-online:hover{border-color:var(--purple);background:var(--purple-lt);}
.mode-card.mode-pdf{border-color:var(--orange-bd);}
.mode-card.mode-pdf:hover{border-color:var(--orange);background:var(--orange-lt);}

/* ── ONLINE WORKSHEET ── */
.ws-screen{padding:20px 24px 24px;display:flex;flex-direction:column;gap:0;}
.ws-screen-back{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:600;color:var(--ink3);cursor:pointer;
  margin-bottom:14px;transition:color 0.15s;
}
.ws-screen-back:hover{color:var(--navy);}
.ws-intro{
  font-size:12.5px;color:var(--ink2);line-height:1.7;
  margin-bottom:16px;padding-bottom:14px;
  border-bottom:1px solid var(--border);
}
.ws-section-lbl{
  font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;
  color:var(--ink4);margin-bottom:10px;
  display:flex;align-items:center;gap:8px;
}
.ws-section-lbl::after{content:'';flex:1;height:1px;background:var(--border);}

.ws-question{
  background:var(--bg);border:1px solid var(--border);
  border-radius:var(--r-md);padding:14px 16px;margin-bottom:10px;
  transition:border-color 0.15s;
}
.ws-question:hover{border-color:var(--border-hover);}
.ws-question.answered{border-color:rgba(176,235,51,0.5);background:rgba(176,235,51,0.04);}
.ws-q-label{
  font-size:9px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;
  margin-bottom:5px;
}
.ws-q-skill{
  font-size:11px;font-weight:700;
  letter-spacing:0.01em;
  margin-bottom:6px;
  display:flex;align-items:center;gap:6px;
}
.ws-q-skill::before{
  content:'';width:3px;height:12px;border-radius:2px;background:currentColor;
}
.ws-q-text{font-size:13px;color:var(--ink);font-weight:500;line-height:1.55;margin-bottom:10px;}
.ws-q-textarea{
  width:100%;min-height:70px;
  background:var(--white);
  border:1.5px solid var(--border);border-radius:8px;
  padding:10px 12px;
  font-family:var(--font);font-size:13px;color:var(--ink);
  line-height:1.5;resize:vertical;outline:none;
  transition:border-color 0.18s,box-shadow 0.18s;
}
.ws-q-textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(112,88,255,0.12);}
.ws-q-textarea::placeholder{color:var(--ink4);}

.ws-progress-bar{
  height:4px;background:var(--border);border-radius:2px;
  margin:0 24px 0;flex-shrink:0;overflow:hidden;
}
.ws-progress-fill{height:100%;border-radius:2px;background:var(--cta-grad);transition:width 0.4s ease;}

.ws-footer{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 24px;border-top:1px solid var(--border);
  flex-shrink:0;background:rgba(15,21,116,0.015);
}
.ws-footer-left{font-size:11px;color:var(--ink4);}
.ws-submit-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--cta-grad);color:#fff;border:none;
  border-radius:var(--r-pill);padding:9px 20px;
  font-family:var(--font);font-size:12px;font-weight:700;
  cursor:pointer;box-shadow:var(--sh-btn);transition:all 0.18s;
}
.ws-submit-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(112,88,255,0.3);}
.ws-submit-btn:disabled{opacity:0.5;cursor:default;transform:none;}

/* ── COMPLETION / RESULTS SCREEN ── */
.results-screen{
  padding:28px 28px 32px;
  display:flex;flex-direction:column;gap:0;
}
.results-headline{
  text-align:center;margin-bottom:24px;
}
.results-emoji{font-size:42px;margin-bottom:8px;line-height:1;}
.results-title{
  font-size:22px;font-weight:800;color:var(--navy);
  letter-spacing:-0.02em;margin-bottom:4px;
}
.results-sub{font-size:13px;color:var(--ink3);}

.score-card{
  background:var(--bg);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:18px 20px;
  margin-bottom:18px;
  display:flex;align-items:center;gap:16px;
}
.score-circle{
  width:60px;height:60px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font);font-size:18px;font-weight:800;
  flex-shrink:0;color:#fff;
  box-shadow:var(--sh-btn);
}
.score-info{flex:1;min-width:0;}
.score-fraction{
  font-size:24px;font-weight:800;color:var(--navy);
  letter-spacing:-0.02em;line-height:1.1;margin-bottom:2px;
}
.score-fraction-total{font-size:18px;color:var(--ink3);font-weight:600;}
.score-label{font-size:11px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink4);}

/* mastery bar */
.mastery-bar-wrap{
  background:var(--bg);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:18px 20px;
  margin-bottom:18px;
}
.mastery-row{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;
}
.mastery-label{
  font-size:11px;font-weight:700;letter-spacing:0.06em;
  text-transform:uppercase;color:var(--ink4);
}
.mastery-pill{
  font-size:11px;font-weight:700;padding:3px 10px;
  border-radius:var(--r-pill);
}
.mastery-track{
  height:10px;background:var(--bg);border:1px solid var(--border);
  border-radius:var(--r-pill);position:relative;overflow:hidden;
}
.mastery-fill{
  height:100%;border-radius:var(--r-pill);
  transition:width 1s cubic-bezier(0.34,1.2,0.64,1);
  width:0%;
}
.mastery-segments{
  display:flex;justify-content:space-between;
  margin-top:8px;
  font-size:9px;font-weight:600;color:var(--ink4);
  letter-spacing:0.04em;text-transform:uppercase;
}
.mastery-msg{
  margin-top:14px;
  font-size:13px;color:var(--ink2);line-height:1.6;
  text-align:center;
}

/* per-question review */
.review-section{margin-top:8px;}
.review-q{
  background:var(--white);border:1px solid var(--border);
  border-radius:var(--r-md);padding:14px 16px;margin-bottom:8px;
}
.review-q-head{
  display:flex;align-items:center;gap:8px;margin-bottom:8px;
}
.review-q-num{
  font-family:var(--mono);font-size:9px;font-weight:700;
  width:22px;height:22px;border-radius:5px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  color:var(--ink4);background:var(--bg);
}
.review-q-text{flex:1;font-size:13px;color:var(--ink);font-weight:500;}
.review-status{
  font-size:10px;font-weight:700;padding:3px 9px;
  border-radius:var(--r-pill);letter-spacing:0.04em;flex-shrink:0;
}
.review-status.correct{color:#5a8a0a;background:rgba(176,235,51,0.18);border:1px solid rgba(176,235,51,0.5);}
.review-status.incorrect{color:#c33;background:rgba(255,79,132,0.10);border:1px solid rgba(255,79,132,0.3);}
.review-status.skipped{color:var(--ink4);background:var(--bg);border:1px solid var(--border);}
.review-answers{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;
}
@media(max-width:540px){.review-answers{grid-template-columns:1fr;}}
.review-ans-block{
  background:var(--bg);border:1px solid var(--border);
  border-radius:7px;padding:7px 10px;
}
.review-ans-lbl{
  font-size:8px;font-weight:700;letter-spacing:0.1em;
  text-transform:uppercase;color:var(--ink4);margin-bottom:3px;
}
.review-ans-txt{
  font-size:12px;color:var(--ink2);line-height:1.4;font-family:var(--mono);
}
.review-ans-block.correct-key{border-color:rgba(176,235,51,0.5);background:rgba(176,235,51,0.06);}

/* result actions */
.result-actions{
  display:flex;gap:8px;margin-top:8px;
}
.result-btn{
  flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 16px;border-radius:var(--r-pill);
  font-family:var(--font);font-size:12px;font-weight:700;
  cursor:pointer;transition:all 0.18s;border:1.5px solid var(--border);
  background:var(--white);color:var(--navy);
}
.result-btn:hover{transform:translateY(-1px);box-shadow:var(--sh-md);border-color:var(--border-hover);}
.result-btn.primary{
  background:var(--cta-grad);color:#fff;border-color:transparent;
  box-shadow:var(--sh-btn);
}
.result-btn.primary:hover{box-shadow:0 6px 20px rgba(112,88,255,0.3);}

/* ── COMPLETION SCREEN (legacy fallback) ── */
.done-screen{
  padding:40px 24px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:12px;
}
.done-icon{font-size:44px;margin-bottom:4px;}
.done-title{font-size:22px;font-weight:800;color:var(--navy);}
.done-sub{font-size:14px;color:var(--ink3);max-width:340px;line-height:1.6;}
.done-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--cta-grad);color:#fff;border:none;
  border-radius:var(--r-pill);padding:11px 24px;margin-top:8px;
  font-family:var(--font);font-size:13px;font-weight:700;
  cursor:pointer;box-shadow:var(--sh-btn);transition:all 0.18s;
}
.done-btn:hover{transform:translateY(-1px);}

/* ══ FOOTER ══ */
.footer{
  margin-top:50px;padding-top:20px;
  border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:10px;
}
.foot-l{font-size:11px;color:var(--ink4);font-weight:500;}
.foot-codes{display:flex;gap:4px;flex-wrap:wrap;}
.foot-code{
  font-family:var(--mono);font-size:9px;font-weight:700;
  padding:2px 8px;border-radius:4px;letter-spacing:0.05em;
}

/* ══ LOAD ANIMATIONS ══ */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.hero{animation:fadeUp 0.45s ease both 0.04s;}
.filter-bar{animation:fadeUp 0.4s ease both 0.1s;}
.dom-card{animation:fadeUp 0.38s ease both;}
.dom-card:nth-child(1){animation-delay:0.12s;}
.dom-card:nth-child(2){animation-delay:0.17s;}
.dom-card:nth-child(3){animation-delay:0.22s;}
.dom-card:nth-child(4){animation-delay:0.27s;}
.dom-card:nth-child(5){animation-delay:0.32s;}
@keyframes rowIn{from{opacity:0;transform:translateX(-5px);}to{opacity:1;transform:none;}}
.oc-row.revealed{animation:rowIn 0.2s ease both;}

::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(15,21,116,0.12);border-radius:3px;}
</style>
</head>

/* answer-matching utility */
function normaliseAns(s){
  return String(s||'').toLowerCase().trim()
    .replace(/\s+/g,' ')
    .replace(/[$°]/g,'')
    .replace(/\s*=\s*/g,'=')
    .replace(/\s*\/\s*/g,'/');
}
function checkAnswer(userAns, acceptable){
  if(!userAns || !userAns.trim()) return false;
  if(!acceptable) return false;
  const u = normaliseAns(userAns);
  return acceptable.some(a => {
    const norm = normaliseAns(a);
    // exact match OR student answer contains the key answer (handles "I think it's 9 hours")
    return u === norm || u.includes(norm) || (norm.includes(u) && u.length >= 2);
  });
}

function buildFilter(){
  const bar=document.getElementById('filterBar');
  const all=mkFB('all','All',null,true);bar.appendChild(all);
  DS.forEach(d=>bar.appendChild(mkFB(d.id,d.id+' · '+d.name,d,false)));
}
function mkFB(id,label,d,on){
  const b=document.createElement('button');
  b.className='fb'+(on?' on':'');b.dataset.fid=id;
  b.innerHTML=d?`<span class="fb-dot" style="background:${d.c}"></span>${d.name}<span class="fb-count">${d.outcomes.length}</span>`
              :`All Domains<span class="fb-count">${DS.reduce((a,x)=>a+x.outcomes.length,0)}</span>`;
  if(on){b.style.background='#0F1574';b.style.color='#fff';}
  b.onclick=()=>setFilter(id,b,d);
  return b;
}
function setFilter(id,btn,d){
  document.querySelectorAll('.fb').forEach(b=>{b.classList.remove('on');b.style.background='';b.style.color='';});
  btn.classList.add('on');
  if(id==='all'){btn.style.background='#0F1574';btn.style.color='#fff';}
  else{btn.style.background=d.c;btn.style.color='#fff';}
  document.querySelectorAll('.dom-card').forEach(c=>{
    c.style.display=(id==='all'||c.dataset.did===id)?'':'none';
  });
}

function toggleDomain(did){
  const card=document.getElementById('body-'+did).closest('.dom-card');
  const body=document.getElementById('body-'+did);
  const inner=document.getElementById('inner-'+did);
  const isOpen=card.classList.contains('open');
  if(isOpen){card.classList.remove('open');body.style.maxHeight='0';}
  else{
    card.classList.add('open');
    const rows=inner.querySelectorAll('.oc-row');
    rows.forEach((r,i)=>setTimeout(()=>r.classList.add('revealed'),30+i*25));
    body.style.maxHeight='0';
    requestAnimationFrame(()=>body.style.maxHeight=inner.scrollHeight+3000+'px');
  }
}

function toggleRow(did,oi){
  const row=document.getElementById(`row-${did}-${oi}`);
  const det=document.getElementById(`det-${did}-${oi}`);
  const body=document.getElementById('body-'+did);
  const inner=document.getElementById('inner-'+did);
  const d=DS.find(x=>x.id===did);const o=d.outcomes[oi];
  const isOpen=row.classList.contains('is-open');
  if(isOpen){row.classList.remove('is-open');det.style.maxHeight='0';return;}
  row.classList.add('is-open');
  if(!det.querySelector('.oc-det-in')){
    const tags=o.tags.map(t=>`<span class="oc-tag" style="color:${d.c};background:${d.cl};border-color:${d.cb}">${t}</span>`).join('');
    const ccssBadge = o.code
      ? `<span class="oc-ccss-code" style="color:${d.c};background:${d.cl};border-color:${d.cb};">${o.code}</span>`
      : '';
    const exBadge = o.ex
      ? `<span class="oc-example" style="margin-left:0;">${o.ex}</span>`
      : '';
    det.innerHTML=`
      <div class="oc-det-in">
        <div class="oc-ccss-row">
          ${ccssBadge}
          ${exBadge}
        </div>
        <div class="oc-desc">${o.d}</div>
        <div class="oc-cols">
          <div>
            <div class="oc-col-lbl">Topics</div>
            <div class="oc-tags">${tags}</div>
          </div>
          <div>
            <div class="oc-col-lbl">Worksheet Preview</div>
            <div class="oc-pdf-placeholder">
              <div class="oc-pdf-icon"><span class="oc-pdf-icon-fold"></span></div>
              <div class="oc-pdf-text">
                <div class="oc-pdf-title">${o.t}</div>
                <div class="oc-pdf-desc">PDF worksheet preview coming soon. Click <strong style="color:${d.c};">Diagnostic Test</strong> at the top of this domain to access the live worksheet.</div>
              </div>
            </div>
          </div>
        </div>
      </div>`;
  }
  det.style.maxHeight='0';
  requestAnimationFrame(()=>{
    det.style.maxHeight=det.scrollHeight+20+'px';
    setTimeout(()=>body.style.maxHeight=inner.scrollHeight+3000+'px',40);
  });
}

/* ═══════════ TOOLTIP — FIXED HOVER HANDOFF ═══════════ */

function startShowTimer(e,d,o,oi,row){
  clearTimeout(showTimer);clearTimeout(hideTimer);
  showTimer=setTimeout(()=>showTooltip(e,d,o,oi,row),380);
}

// Outcome row hover — shows sample questions only (no CTA)
// Anchored to the RIGHT side of the row so it doesn't block the learning skill text
function showTooltip(e,d,o,oi,row){
  clearTimeout(hideTimer);
  const tip=document.getElementById('wsTooltip');
  document.getElementById('wsTipIcon').textContent=d.icon;
  document.getElementById('wsTipIcon').style.cssText=`background:${d.cl};color:${d.c};`;
  document.getElementById('wsTipTitle').textContent=o.t;
  document.getElementById('wsTipTitle').style.color=d.c;
  document.getElementById('wsTipSub').textContent=(o.code||d.code)+' · '+d.name;
  document.getElementById('wsTipPreviewLabel').textContent='Sample questions';
  const qsEl=document.getElementById('wsTipQs');
  qsEl.innerHTML=o.qs.slice(0,3).map((q,i)=>`<div class="ws-q"><span class="ws-q-num">${i+1}.</span><span>${q}</span></div>`).join('');
  document.getElementById('wsTipCta').style.display='none';
  positionTooltipForRow(row);
  tip.classList.add('visible');
  tip.onmouseenter=()=>clearTimeout(hideTimer);
  tip.onmouseleave=()=>startHideTimer();
}

// Tooltip sits in a CONSISTENT column for all rows in a card:
// right-aligned with the row's right edge (just left of the toggle),
// and vertically centered on whichever row is hovered.
function positionTooltipForRow(row){
  const tip=document.getElementById('wsTooltip');
  const rect = row.getBoundingClientRect();
  const tw = 320;
  // Right-align tooltip with the row's right edge, with a small gap so it doesn't cover the toggle
  let x = rect.right - tw - 12;
  if(x < 16) x = 16;
  if(x + tw > window.innerWidth - 16) x = window.innerWidth - tw - 16;
  // Vertical: center on the hovered row
  const th = tip.offsetHeight || 280;
  let y = rect.top + rect.height/2 - th/2;
  if(y < 10) y = 10;
  if(y + th > window.innerHeight - 10) y = window.innerHeight - th - 10;
  tip.style.left = x + 'px';
  tip.style.top  = y + 'px';
}

// Old positionTooltip is still used by the domain Diagnostic Test button hover (cursor-anchored)
function positionTooltip(e){
  const tip=document.getElementById('wsTooltip');
  if(!tip.classList.contains('visible'))return;
  const tw=295,margin=14;
  let x=e.clientX+margin, y=e.clientY-70;
  if(x+tw>window.innerWidth-10)x=e.clientX-tw-margin;
  if(y<10)y=10;
  const th=tip.offsetHeight||260;
  if(y+th>window.innerHeight-10)y=window.innerHeight-th-10;
  tip.style.left=x+'px';tip.style.top=y+'px';
}

// Domain header worksheet button hover — shows preview of cross-outcome questions + CTA
function showDomainTooltip(e,d){
  clearTimeout(hideTimer);

  document.getElementById('wsTipTitle').textContent=d.name+' Worksheet';

  document.getElementById('wsTipSub').textContent=d.code+' · '+d.outcomes.length+' skills covered';
  document.getElementById('wsTipPreviewLabel').textContent=`Sample — ${d.outcomes.length} questions across all skills`;
  const qsEl=document.getElementById('wsTipQs');
  // Pick one preview question from each outcome, prefix with skill number
  const preview = d.outcomes.slice(0,3).map((o,oi)=>{
    return `<div class="ws-q"><span class="ws-q-num" style="color:${d.c};">${String(oi+1).padStart(2,'0')}</span><span><strong style="color:var(--ink);font-size:10.5px;display:block;margin-bottom:2px;">${o.t}</strong>${o.qs[0]}</span></div>`;
  }).join('');
  const more = d.outcomes.length > 3
    ? `<div style="font-size:10px;color:var(--ink4);text-align:center;padding:6px 0 2px;font-weight:600;">+ ${d.outcomes.length-3} more skill${d.outcomes.length-3===1?'':'s'} in the full worksheet</div>`
    : '';
  qsEl.innerHTML = preview + more;
  // Show CTA — opens the domain-wide worksheet
  const cta = document.getElementById('wsTipCta');
  cta.style.display='flex';
  cta.style.color=d.c;cta.style.background=d.cl;cta.style.borderTopColor=d.cb;
  cta.onclick=()=>openDomainWorksheet(d);
  positionTooltip(e);
  tip.classList.add('visible');
  tip.onmouseenter=()=>clearTimeout(hideTimer);
  tip.onmouseleave=()=>startHideTimer();
}

function startHideTimer(){
  clearTimeout(showTimer);
  hideTimer=setTimeout(()=>{
    document.getElementById('wsTooltip').classList.remove('visible');
  },200);
}

/* ═══════════ DOMAIN WORKSHEET ═══════════ */
// Build a synthetic outcome containing one question from each sub-skill
function openDomainWorksheet(d){
  // Pick first question from each outcome and build aggregated lists
  const aggregatedQs = d.outcomes.map(o => o.qs[0]);
  const aggregatedSkillTitles = d.outcomes.map(o => o.t);
  const aggregatedTags = [...new Set(d.outcomes.flatMap(o => o.tags))].slice(0,8);
  const aggregatedSkills = d.outcomes.map((o,i) => `Outcome ${String(i+1).padStart(2,'0')} · ${o.t}`);

  const combinedAnswerKey = d.outcomes.map((o,oi) => {
    const k = ANSWERS[`${d.id}-${oi}`];
    return k && k[0] ? k[0] : [];
  });

  const synth = {
    t: `${d.name} — Full Worksheet`,
    d: `A mixed-skill worksheet covering all ${d.outcomes.length} outcomes in ${d.code}: ${d.name}. One question is given from each sub-skill so you can practise the full domain in one go.`,
    tags: aggregatedTags,
    skills: aggregatedSkills,
    qs: aggregatedQs,
    skillTitles: aggregatedSkillTitles,  // used in worksheet rendering
    isDomain: true,
    domainAnswerKey: combinedAnswerKey,
  };
  openModal(d, synth, -1);
}

/* ═══════════ MODAL — MODE CHOICE + ONLINE ANSWERING ═══════════ */

function openModal(d,o,oi){
  clearTimeout(hideTimer);
  document.getElementById('wsTooltip').classList.remove('visible');
  // For domain worksheets oi = -1 and the answer key is on the synthetic outcome itself
  const outcomeIdx = (oi === -1) ? -1 : d.outcomes.indexOf(o);
  const key = outcomeIdx === -1 ? null : `${d.id}-${outcomeIdx}`;
  currentModalData = {d, o, oi, key};

  document.getElementById('mIcon').textContent=d.icon;
  document.getElementById('mIcon').style.cssText=`background:${d.cl};color:${d.c};`;
  document.getElementById('mDomain').textContent=d.code+' · '+d.name;
  document.getElementById('mDomain').style.color=d.c;
  document.getElementById('mTitle').textContent=o.t;

  // hide footer + progress until mode chosen
  document.getElementById('wsFooter').style.display='none';
  document.getElementById('wsProgressBar').style.display='none';

  // show mode choice screen
  showModeScreen(d,o);
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}

      ${o.qs.map((q,i)=>{
        // For domain worksheets, prefix with the skill title
        const skillLine = (o.isDomain && o.skillTitles && o.skillTitles[i])
          ? `<div class="ws-q-skill" style="color:${d.c};">${o.skillTitles[i]}</div>`

      }).join('')}

}

function onAnswerInput(idx, total){
  const ta = document.getElementById('wqa'+idx);
  const qBox = document.getElementById('wq'+idx);
  qBox.classList.toggle('answered', ta.value.trim().length > 0);
  // count filled
  let filled=0;
  for(let i=0;i<total;i++){
    const t=document.getElementById('wqa'+i);
    if(t && t.value.trim().length>0) filled++;
  }
  updateProgress(filled,total);
  document.getElementById('wsSubmitBtn').disabled = filled===0;
}

function updateProgress(filled,total){
  const pct = total>0 ? Math.round(filled/total*100) : 0;
  document.getElementById('wsProgressFill').style.width=pct+'%';
  document.getElementById('wsFooterLeft').textContent=`${filled} of ${total} answered`;
}

function submitWorksheet(){
  const {d, o, key} = currentModalData;
  const total = o.qs.length;

  // Get answer key — either per-outcome or per-question for domain mode
  const getAcceptable = (i) => {
    if(o.isDomain && o.domainAnswerKey){
      return o.domainAnswerKey[i] || [];
    }
    const ak = ANSWERS[key] || [];
    return ak[i] || [];
  };

  // grade each question
  const results = o.qs.map((q, i)=>{
    const ta = document.getElementById('wqa'+i);
    const userAns = ta ? ta.value.trim() : '';
    const acceptable = getAcceptable(i);
    let status;
    if(!userAns) status = 'skipped';
    else if(checkAnswer(userAns, acceptable)) status = 'correct';
    else status = 'incorrect';
    const skillLabel = o.isDomain && o.skillTitles ? o.skillTitles[i] : null;
    return {q, userAns, acceptable, status, i, skillLabel};
  });

  const correct = results.filter(r=>r.status==='correct').length;
  const incorrect = results.filter(r=>r.status==='incorrect').length;
  const skipped = results.filter(r=>r.status==='skipped').length;
  const pct = Math.round((correct/total)*100);

  // mastery tier
  let tier, tierLabel, tierColor, tierBg, tierMsg, scoreColor, emoji;
  if(pct >= 80){
    tier = 'mastered';
    tierLabel = 'Mastered';
    tierColor = '#5a8a0a';
    tierBg = 'rgba(176,235,51,0.18)';
    scoreColor = 'linear-gradient(135deg,#B0EB33,#5a8a0a)';
    tierMsg = "You've mastered this skill — fantastic work! Ready to tackle the next outcome?";
    emoji = '🎉';
  } else if(pct >= 50){
    tier = 'know';
    tierLabel = 'Know the topic';
    tierColor = '#7058FF';
    tierBg = 'rgba(112,88,255,0.14)';
    scoreColor = 'linear-gradient(135deg,#7058FF,#FF4F84)';
    tierMsg = "You've got the basics down. A little more practice will get you to mastery.";
    emoji = '💪';
  } else {
    tier = 'practice';
    tierLabel = 'Keep practising';
    tierColor = '#FF6635';
    tierBg = 'rgba(255,102,53,0.14)';
    scoreColor = 'linear-gradient(135deg,#FFA41C,#FF6635)';
    tierMsg = "This one needs a bit more work. Review the outcome description and try again — you've got this!";
    emoji = '🌱';
  }

  // hide footer + progress
  document.getElementById('wsFooter').style.display='none';
  document.getElementById('wsProgressBar').style.display='none';

  // build review markup
  const reviewMarkup = results.map(r => {
    const userText = r.userAns || '<em style="color:var(--ink4);font-style:italic;">No answer given</em>';
    const keyText  = r.acceptable.length ? r.acceptable[0] : '—';
    const statusClass = r.status;
    const statusLabel = r.status==='correct' ? '✓ Correct' : r.status==='incorrect' ? '✗ Try again' : '— Skipped';
    const skillLine = r.skillLabel ? `<div style="font-size:10px;font-weight:700;color:${d.c};margin-bottom:4px;">${r.skillLabel}</div>` : '';
    return `
      <div class="review-q">
        <div class="review-q-head">
          <span class="review-q-num">${String(r.i+1).padStart(2,'0')}</span>
          <div style="flex:1;">
            ${skillLine}
            <span class="review-q-text">${r.q}</span>
          </div>
          <span class="review-status ${statusClass}">${statusLabel}</span>
        </div>
        <div class="review-answers">
          <div class="review-ans-block">
            <div class="review-ans-lbl">Your answer</div>
            <div class="review-ans-txt">${userText}</div>
          </div>
          <div class="review-ans-block correct-key">
            <div class="review-ans-lbl" style="color:#5a8a0a;">Sample answer</div>
            <div class="review-ans-txt">${keyText}</div>
          </div>
        </div>
      </div>`;
  }).join('');

  document.getElementById('mBody').innerHTML = `
    <div class="results-screen">
      <div class="results-headline">
        <div class="results-emoji">${emoji}</div>
        <div class="results-title">${tier==='mastered' ? 'Excellent work!' : tier==='know' ? 'Good job!' : 'Nice effort!'}</div>
        <div class="results-sub">Here's how you did on <strong>${o.t}</strong></div>
      </div>

      <div class="score-card">
        <div class="score-circle" style="background:${scoreColor};">${correct}/${total}</div>
        <div class="score-info">
          <div class="score-fraction">${correct}<span class="score-fraction-total">/${total} correct</span></div>
          <div class="score-label">${incorrect>0 ? incorrect+' incorrect · ' : ''}${skipped>0 ? skipped+' skipped' : (incorrect===0?'Perfect!':'')}</div>
        </div>
      </div>

      <div class="mastery-bar-wrap">
        <div class="mastery-row">
          <span class="mastery-label">Mastery level</span>
          <span class="mastery-pill" style="background:${tierBg};color:${tierColor};">${tierLabel}</span>
        </div>
        <div class="mastery-track">
          <div class="mastery-fill" id="masteryFill" style="background:${scoreColor};"></div>
        </div>
        <div class="mastery-segments">
          <span>Practising</span>
          <span>Knows it</span>
          <span>Mastered</span>
        </div>
        <div class="mastery-msg">${tierMsg}</div>
      </div>

      <div class="ws-section-lbl">Question review</div>
      <div class="review-section">${reviewMarkup}</div>

      <div class="result-actions">
        <button class="result-btn" onclick="startOnlineWorksheet()">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="2,6 5,3 5,5 9,5 9,7 5,7 5,9"/></svg>
          Try again
        </button>
        <button class="result-btn primary" onclick="closeModalDirect()">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><polyline points="2,6 5,9 10,3" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Done
        </button>
      </div>
    </div>`;

  // animate the mastery bar
  setTimeout(()=>{
    const fill = document.getElementById('masteryFill');
    if(fill) fill.style.width = pct+'%';
  }, 250);
}
